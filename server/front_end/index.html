<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation graph</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101318;color:#e8edf4}*{box-sizing:border-box}body{margin:0}header{height:84px;padding:18px 26px;border-bottom:1px solid #303640;display:flex;align-items:center;gap:24px;background:#15191f}h1{font-size:20px;margin:0 0 4px}small,.muted{color:#929eae;font-size:12px}.controls{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:12px}select,button{background:#242b35;color:inherit;border:1px solid #445063;border-radius:7px;padding:8px;max-width:260px}button{cursor:pointer}#connection{color:#e8b771}#connection.live{color:#82dbb0}main{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 84px)}#viewport{overflow:auto;background-image:radial-gradient(#303742 1px,transparent 1px);background-size:22px 22px;position:relative}#canvas{position:relative;min-height:100%;min-width:100%}svg{position:absolute;inset:0;pointer-events:none}.node{position:absolute;width:264px;height:132px;border:1px solid #52627c;border-radius:12px;background:#191f29;padding:15px;text-align:left;color:inherit;box-shadow:0 6px 20px #0003;overflow:hidden}.node:hover{background:#242c38}.node.selected{outline:2px solid #eff6ff;outline-offset:3px}.node.person{border-top:3px solid #96b7ff}.node.action{border-top:3px solid #d3adff}.node.final{border-top:3px solid #7bd6b0}.node .type{font-size:10px;font-weight:700;letter-spacing:1px;color:#a9bbda}.node .label{margin-top:10px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}.node .meta{position:absolute;bottom:10px;right:14px;font-size:10px;color:#a0adbf;background:#191f29;padding-left:6px}.depth{position:absolute;left:18px;font:11px monospace;color:#8d99ac}aside{overflow:auto;padding:24px;border-left:1px solid #303640;background:#15191f}aside h2{font-size:16px;margin-top:0}#detail{font-size:13px;line-height:1.6;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0e1116;padding:14px;border:1px solid #303640;border-radius:8px;font:12px/1.6 monospace}summary{cursor:pointer;color:#acbacd}.legend{display:flex;gap:16px;margin:18px 0;font-size:11px;color:#acbacd}.legend span:before{content:'●';margin-right:6px}.legend span:nth-child(1){color:#96b7ff}.legend span:nth-child(2){color:#d3adff}.legend span:nth-child(3){color:#7bd6b0}#empty{position:absolute;top:28vh;left:0;right:0;text-align:center;color:#a3afbf;padding:24px}#empty strong{display:block;color:#e8edf4;font-size:22px;margin-bottom:12px}.added{color:#88dfae}.removed{color:#ffa4a4}label{display:flex;align-items:center;gap:5px}@media(max-width:850px){header{height:auto;flex-wrap:wrap;padding:14px}.controls{margin-left:0;flex-wrap:wrap}main{height:calc(100vh - 130px);grid-template-columns:minmax(0,1fr) 290px}}@media(max-width:580px){main{grid-template-columns:1fr}aside{height:35vh;border-top:1px solid #303640}#viewport{height:55vh}main{height:auto}}
</style>
<header><div><h1>Conversation graph</h1><small>Prompts → actions → responses</small></div><div class="controls"><span id="connection" role="status">Connecting…</span><select id="sessions" aria-label="Session"></select><label><input id="follow" type="checkbox" checked> Follow live</label><button id="latest">Latest turn ↓</button></div></header>
<main><section id="viewport" aria-label="Live conversation DAG"><div id="canvas"></div></section><aside><h2>Node inspector</h2><div class="legend"><span>human_input</span><span>tool / file action</span><span>assistant_response</span></div><div id="detail">Select a node to inspect its message, file changes, and exact line numbers.</div></aside></main>
<script>
let graph={nodes:[],edges:[],sessions:[]}, session='',selected='',lastCount=0;
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
function element(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function stepSummary(node){if(['human_input','assistant_response'].includes(node.action_type))return node.event?.message??node.label;
const d=node.description;if(!d)return node.label;
return d.current_action_summary||node.label}
function actualContent(target,detail){
const event=target.event||{},isMessage=['human_input','assistant_response'].includes(target.action_type);
if(isMessage){detail.append(element('h3',target.action_type==='human_input'?'Sent input':'Final response'),element('pre',event.message??target.label??''));return}
detail.append(element('h3','Actual action'),element('p',event.tool_name||target.label||'Not recorded.'));
const input=event.tool_input;
detail.append(element('pre',input===undefined||input===null||input===''?'No action input recorded.':typeof input==='string'?input:JSON.stringify(input,null,2)));
}
function descriptionSections(target,detail){
const d=target.description||{},empty=target.description_status==='pending'?'Awaiting analysis…':'Not available for this node.';
function textSection(title,value){detail.append(element('h3',title),element('p',typeof value==='string'&&value.trim()?value:empty,typeof value==='string'&&value.trim()?'':'muted'))}
function listSection(title,values){detail.append(element('h3',title));if(Array.isArray(values)&&values.length){const list=element('ul');for(const value of values)list.append(element('li',value));detail.append(list)}else detail.append(element('p',Array.isArray(values)?'None recorded.':empty,'muted'))}
if(target.action_type==='human_input'){
textSection('Progress summary',d.current_prompt_interpretation||target.label);
listSection('Offloaded tasks',d.current_offloaded_tasks);
textSection('History interpretation',d.history_interpretation);
}else if(target.action_type==='assistant_response'){
detail.append(element('h3','Task response visibility'));
if(Array.isArray(d.TaskClarity)&&d.TaskClarity.length){for(const task of d.TaskClarity){
detail.append(element('h4',task.task_num===undefined?'Task':'Task '+task.task_num));
textSection('Visibility overview',task.response_visibility_overview);
detail.append(element('p','Visibility score: '+(typeof task.response_visibility_score==='number'?task.response_visibility_score+' / 100':'Not available')));
listSection('Missing information',task.missing_info);
}}else detail.append(element('p',empty,'muted'));
}else{
textSection('Action summary',d.current_action_summary||target.label);
textSection('Previous tasks and prompt interpretation',d.previous_tasks_and_prompt_interpretation);
detail.append(element('h3','Offloaded task progress'));
if(Array.isArray(d.offloaded_task_progress)&&d.offloaded_task_progress.length){for(const task of d.offloaded_task_progress){
detail.append(element('h4',task.task_num===undefined?'Task':'Task '+task.task_num),element('p',task.task_update||empty));
detail.append(element('p','Worked on: '+(task.worked_on===true?'Yes':task.worked_on===false?'No':'Not available'),'muted'));
}}else detail.append(element('p',Array.isArray(d.offloaded_task_progress)?'None recorded.':empty,'muted'));
listSection('New tasks',d.new_tasks);
}
}
function latest(){const view=$('viewport');view.scrollTop=view.scrollHeight;view.scrollLeft=(view.scrollWidth-view.clientWidth)/2}
function inspect(){const target=graph.nodes.find(n=>n.id===selected),detail=$('detail');detail.replaceChildren();if(!target){detail.textContent='Select a node to inspect its message, file changes, and exact line numbers.';return}
detail.append(element('h2',target.action_type),element('p','Depth '+target.depth+' · '+target.event.change_stage));
actualContent(target,detail);
descriptionSections(target,detail);
if(target.description_status==='pending')detail.append(element('p','Summarizing…','muted'));
if(target.description_status==='error')detail.append(element('p','Analysis unavailable for this step.','muted'));
if(target.description){const analysis=element('details');analysis.append(element('summary','Task progress details'),element('pre',JSON.stringify(target.description,null,2)));detail.append(analysis)}
if(target.file_change){const change=target.file_change;detail.append(element('p',change.path));detail.append(element('p',change.line_changes_source==='filesystem_snapshots'?'Observed file changes':'Requested changes / patch evidence','muted'));
const pre=element('pre');for(const line of change.line_changes||[]){const number=line.type==='added'?line.new_line:line.old_line;pre.append(element('div',(line.type==='added'?'+':'−')+' '+(number??'?')+'  '+line.text,line.type))}if(!pre.childNodes.length)pre.textContent='No changed lines recorded.';detail.append(pre);
}
if(target.event.tool_output)detail.append(element('h3','Tool result'),element('pre',typeof target.event.tool_output==='string'?target.event.tool_output:JSON.stringify(target.event.tool_output,null,2)));
const raw=element('details');raw.append(element('summary','Raw node JSON'),element('pre',JSON.stringify(target,null,2)));detail.append(raw)}
function connections(nodes,storedEdges){
const ids=new Set(nodes.map(n=>n.id)),edges=new Map(),turns=new Map();
function connect(source,target){if(source&&target&&source!==target&&ids.has(source)&&ids.has(target))edges.set(JSON.stringify([source,target]),{source,target})}
for(const edge of storedEdges)connect(edge.source,edge.target);
for(const node of nodes){if(!node.turn_id)continue;if(!turns.has(node.turn_id))turns.set(node.turn_id,[]);turns.get(node.turn_id).push(node)}
let previousResponse;
for(const turn of turns.values()){
const prompt=turn.find(n=>n.action_type==='human_input'),response=turn.find(n=>n.action_type==='assistant_response'),actions=turn.filter(n=>!['human_input','assistant_response'].includes(n.action_type));
if(prompt)connect(previousResponse?.id,prompt.id);
if(actions.length){for(const action of actions){connect(prompt?.id,action.id);connect(action.id,response?.id)}}else connect(prompt?.id,response?.id);
previousResponse=response;
}
return [...edges.values()];
}
function render(){const nodes=graph.nodes.filter(n=>n.session_id===session),canvas=$('canvas');canvas.replaceChildren();
if(!nodes.length){const empty=element('div');empty.id='empty';empty.append(element('strong','Waiting for the next prompt'),element('div','Keep this page open and chat in Codex. Nodes appear as events arrive.'));canvas.append(empty);inspect();return}
const rows=new Map();for(const node of nodes){const layer=(node.depth-1)*3+(node.action_type==='human_input'?0:node.action_type==='assistant_response'?2:1);if(!rows.has(layer))rows.set(layer,[]);rows.get(layer).push(node)}
const max=Math.max(...Array.from(rows.values(),r=>r.length)),width=Math.max($('viewport').clientWidth,max*294+120),height=(Math.max(...rows.keys())+1)*210+70;canvas.style.width=width+'px';canvas.style.height=height+'px';
const positions=new Map();for(const [depth,row] of rows){const badge=element('div','DEPTH '+row[0].depth,'depth');badge.style.top=(depth*210+25)+'px';canvas.append(badge);row.forEach((node,i)=>positions.set(node.id,{x:(width-row.length*294+30)/2+i*294,y:depth*210+54}))}
const svg=document.createElementNS(ns,'svg');svg.setAttribute('width',width);svg.setAttribute('height',height);const defs=document.createElementNS(ns,'defs');const marker=document.createElementNS(ns,'marker');for(const [k,v] of Object.entries({id:'arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'}))marker.setAttribute(k,v);const arrow=document.createElementNS(ns,'path');arrow.setAttribute('d','M 0 0 L 10 5 L 0 10 z');arrow.setAttribute('fill','#61728b');marker.append(arrow);defs.append(marker);svg.append(defs);
for(const edge of connections(nodes,graph.edges)){const a=positions.get(edge.source),b=positions.get(edge.target);if(!a||!b)continue;const path=document.createElementNS(ns,'path');const x=a.x+132,y=a.y+132,X=b.x+132,Y=b.y;path.setAttribute('d',`M ${x} ${y} C ${x} ${(y+Y)/2}, ${X} ${(y+Y)/2}, ${X} ${Y-3}`);path.setAttribute('fill','none');path.setAttribute('stroke','#91a9cc');path.setAttribute('stroke-width','2');path.setAttribute('marker-end','url(#arrow)');svg.append(path)}canvas.append(svg);
for(const node of nodes){const p=positions.get(node.id),cls=node.action_type==='human_input'?'person':node.action_type==='assistant_response'?'final':'action',card=element('button',undefined,'node '+cls+(selected===node.id?' selected':''));card.style.left=p.x+'px';card.style.top=p.y+'px';card.append(element('div',node.action_type,'type'),element('div',stepSummary(node),'label'),element('div',!['human_input','assistant_response'].includes(node.action_type)?(node.event.change_stage==='reported'?'● reported':'◌ requested'):'depth '+node.depth,'meta'));card.title=stepSummary(node)+(node.description_status==='pending'?' — Summarizing…':node.description_status==='error'?' — Summary unavailable':'');card.onclick=()=>{selected=node.id;render()};canvas.append(card)}inspect();
}
function update(data){graph=data;const picker=$('sessions');picker.replaceChildren();for(const id of graph.sessions){const option=element('option',id==='unknown-session'?'Unknown session':id.slice(0,8)+'…'+id.slice(-5));option.value=id;picker.append(option)}if(!session||!graph.sessions.includes(session))session=graph.sessions.at(-1)||'';picker.value=session;render();const count=graph.nodes.filter(n=>n.session_id===session).length;if($('follow').checked&&count!==lastCount)latest();lastCount=count}
$('sessions').onchange=e=>{session=e.target.value;selected='';render();latest()};$('latest').onclick=latest;window.addEventListener('resize',render);
const stream=new EventSource('/api/stream');stream.onopen=()=>{$('connection').textContent='● Live';$('connection').className='live'};stream.onmessage=e=>update(JSON.parse(e.data));stream.onerror=()=>{$('connection').textContent='Reconnecting…';$('connection').className=''};render();
</script>
</html>
